<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office 410 – Klick mich</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>">
  <style>
    .klick-wrap { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; }
    .klick-knopf { font-family: 'Bangers', cursive; font-size: 4rem; letter-spacing: 3px; padding: 20px 50px; border: 6px solid #fff; background: #ff0; color: #000; cursor: pointer; transform: rotate(-3deg); box-shadow: 10px 10px 0 #f0f; transition: transform .1s; }
    .klick-knopf:hover { transform: rotate(3deg) scale(1.05); }
    .klick-knopf:active { transform: scale(.92); }
    .praank-overlay { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; overflow: hidden; background: #ff0; pointer-events: none; }
    .praank-overlay.an { display: flex; animation: praank-blitz .9s steps(4) forwards; }
    .praank-text { font-family: 'Bangers', cursive; font-size: 40vw; line-height: 1; color: #e00; text-shadow: 0 0 0 #000, 8px 8px 0 #000, -8px -8px 0 #fff; white-space: nowrap; animation: praank-zoom .9s cubic-bezier(.2,1.6,.4,1) forwards, praank-wackeln .12s linear 6; }
    @keyframes praank-zoom { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.3) rotate(4deg); } 100% { transform: scale(1) rotate(-3deg); } }
    @keyframes praank-wackeln { 0%,100% { translate: 0 0; } 25% { translate: -18px 10px; } 50% { translate: 16px -12px; } 75% { translate: -10px -16px; } }
    @keyframes praank-blitz { 0% { background: #fff; } 25% { background: #f0f; } 50% { background: #0ff; } 75% { background: #ff0; } 100% { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body class="party">
  <header class="topbar">
    <a class="logo" href="index.html">OFFICE 410 <small>| Corporate Communications</small></a>
    <nav>
      <a href="index.html">Start</a>
      <a href="events.html">Events</a>
      <a href="news.html">Office News</a>
      <a href="games.html">Office Games</a>
      <a href="praank.html" class="aktiv">Klick mich</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="klick-wrap">
      <h1>Bitte nicht klicken</h1>
      <button class="klick-knopf" id="klick-knopf" type="button">Klick mich</button>
      <p class="text">Rein formell: Die Nutzung dieses Knopfes ist freiwillig. Die Geschäftsleitung übernimmt keine Haftung für Schreckmomente.</p>
    </section>
  </main>

  <div class="praank-overlay" id="praank-overlay" aria-hidden="true">
    <div class="praank-text">PRAAANK</div>
  </div>

  <script>
    (function () {
      var knopf = document.getElementById('klick-knopf');
      var overlay = document.getElementById('praank-overlay');
      var timer = null;
      knopf.addEventListener('click', function () {
        overlay.classList.remove('an');
        void overlay.offsetWidth; // Animation neu starten
        overlay.classList.add('an');
        clearTimeout(timer);
        timer = setTimeout(function () { overlay.classList.remove('an'); }, 1500);
      });
    })();
  </script>
</body>
</html>
